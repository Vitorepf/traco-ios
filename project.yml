name: Traco
options:
  # ADR 2026-09-03f: um idioma só, e é o português. Todo motor do app é
  # pt-BR — a análise, o parser do calendário, a lente, o domínio, o ditado
  # e os feriados. Interface em inglês sobre isso seria uma promessa falsa.
  developmentLanguage: pt
  knownRegions: [pt]
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  Traco:
    type: application
    platform: iOS
    sources:
      # ADR 05u: `Traco/App/Intents/` é o catálogo; `Compartilhado/` também
      # compila no widget (declarações que o `Button(intent:)` precisa).
      # ADR 04f: `LiveActivityIntent` roda no processo do APP — só o app
      # executa (`TRACO_APP`); a extensão só declara.
      - path: Traco
    dependencies:
      - target: TracoWidget
      - sdk: WidgetKit.framework
    info:
      path: Traco/Info-extra.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.traco
            CFBundleURLSchemes: [traco]
        # a tela de arranque nasce no papel (#F4F4F2), não num branco que
        # pisca antes do app (auditoria 15/09, 21); o xcodegen escreve o plist
        UILaunchScreen:
          UIColorName: Papel
    entitlements:
      path: Traco/Traco.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.traco
        # ADR 04a/04e: o que o AUTOR marcou atravessa o Foco; o que o app
        # inventou de cobrar, não. Um alarme de dentista que o modo Foco
        # engole é exatamente "está marcado e não adianta nada".
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.traco
        # ASCII de propósito (06/09): com "Traço" o executável ia ao disco em
        # NFD (c + cedilha combinante) e o CFBundleExecutable em NFC; o chronod
        # comparava os dois, não reconhecia o app como dono do widget e
        # recusava TODO `reloadTimelines` (ChronoCoreErrorDomain 27, "Resolved
        # bundle path …/Traço.app does not match executable Traço"). O nome
        # que o autor vê é o CFBundleDisplayName, que segue "Traço".
        PRODUCT_NAME: Traco
        PRODUCT_MODULE_NAME: Traco
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Traço
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "W28WF9A5A2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TRACO_APP"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Traço guarda nesta nota a foto que você escolheu."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Traço guarda nesta nota o áudio que você gravou."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Reabrir uma escrita selada pede o seu rosto — foi você que pediu para ela ficar fechada."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transformar em letra o que você ditou. O reconhecimento acontece no aparelho — o áudio não sai daqui."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Ler os seus calendários para já sugerir o próximo compromisso. O Traço só lê — nunca escreve na sua agenda."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Ler os seus calendários para já sugerir o próximo compromisso. O Traço só lê — nunca escreve na sua agenda."
  TracoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TracoTests
      # ADR 06d: a linha do tempo do widget (entradas do dia e política de
      # volta) é lógica pura e tem teste — o `.never` que congelou os widgets
      # no iPhone do dono não se via em nenhuma suíte.
      - path: TracoWidget/Relogio.swift
    dependencies:
      - target: Traco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.traco.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Traco.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Traco
  # V12-E: o condutor da prova de tela da Página — toques reais pelo XCTest,
  # sem o helper compartilhado do `orca emulator` (que relança o app da frente
  # ao anexar e, disputado por três voltas, o derruba). Corre só pelo esquema
  # `TracoUITests`; a suíte integral (`Traco`) não o inclui.
  TracoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TracoUITests
    dependencies:
      - target: Traco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.traco.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Traco
        # XCTestCase é nonisolated; o padrão MainActor do projeto não serve aqui
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  TracoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TracoWidget
      - path: Traco/Tema.swift
      # ADR 05u: só a superfície (snapshot), os atributos das atividades e
      # as declarações dos dois LiveActivityIntent. Nada de SwiftData, Rota
      # ou domínio na extensão: o app é o único escritor.
      - path: Traco/App/Intents/Compartilhado
    entitlements:
      path: TracoWidget/TracoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.traco
    info:
      path: TracoWidget/Info.plist
      properties:
        CFBundleDisplayName: Traço
        # a versão vem do target, não de texto fixo: extensão com versão
        # diferente do app é recusa na validação do App Store Connect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.traco.widget
        PRODUCT_NAME: TracoWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "W28WF9A5A2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Traco:
    build:
      targets:
        Traco: all
        TracoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TracoTests
  TracoUITests:
    build:
      targets:
        Traco: all
        TracoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TracoUITests
