name: Traco
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  Traco:
    type: application
    platform: iOS
    sources:
      - path: Traco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.traco
        PRODUCT_NAME: Traço
        PRODUCT_MODULE_NAME: Traco
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Traço
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Traço guarda nesta nota a foto que você escolheu."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Traço guarda nesta nota o áudio que você gravou."
  TracoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TracoTests
    dependencies:
      - target: Traco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.traco.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Traço.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Traço
schemes:
  Traco:
    build:
      targets:
        Traco: all
        TracoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TracoTests
