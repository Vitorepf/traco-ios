# Volta M3-B: o TOM do cartão vestido, na tela.
#
# A frase é do revisor do G3 (m3-rev-03). O cabeçalho antigo dizia que "o
# roteamento ainda a veste de Exame da noite e o conserto mora em Traco/Analise":
# o conserto ESTÁ FEITO, duas vezes, e a frase morreu — a ADR 2026-09-06h pôs a
# guarda em AnaliseLocal.eEscritaPessoal, e a 06i-E mudou `não devia ter` da
# família 5 para a 4, fechando a confissão curta. A prova em teste é
# EscritaPessoalTests. Não procure o conserto: ele já passou.
#
# O que este fluxo prova, e é a única coisa que ele prova, é o TOM: quando o
# cartão chega (por quem CONVOCA o método pelo nome, não por confissão), ele diz
# "o seu dia em revista — e uma regra para amanhã", não "pedindo julgamento — dos
# seus atos". Motores desligados ANTES do fluxo (o degrau de bordo decide antes da
# regex e pode discordar dela):
#   xcrun simctl spawn <UDID> launchctl setenv TRACO_SEM_MODELO 1
appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- extendedWaitUntil:
    visible: {id: pagina}
    timeout: 8000
# clearState zera a permissão: o alerta de notificação cobre o teclado
- runFlow:
    when:
      visible: "Não Permitir"
    commands:
      - tapOn: "Não Permitir"
- tapOn: {id: pagina}
# ADR 2026-09-06h: a frase original desta prova ("Perdi a paciencia com ela
# hoje. Me arrependi e chorei.") e confissao de conduta e a guarda a CALA, que e
# o certo. O tom do Exame se prova com quem convoca o metodo.
- inputText: "Exame da noite: o que do dia de trabalho eu nao repito amanha."
- extendedWaitUntil:
    visible: "Deixar como nota"
    timeout: 8000
- assertVisible: "isto é o seu dia em revista — e uma regra para amanhã."
- assertNotVisible: "isto é o seu dia pedindo julgamento — dos seus atos."
