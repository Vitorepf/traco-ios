appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
- tapOn:
    id: "configurar-chave"
- extendedWaitUntil:
    visible: "Análise com Grok"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/hoje/08-chave-grok
