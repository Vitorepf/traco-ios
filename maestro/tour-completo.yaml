appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible: "Deixar como nota"
    timeout: 6000
- tapOn: "Deixar como nota"
- tapOn:
    id: "concluir"
- tapOn:
    id: pagina
- inputText: "eu sou um vencedor"
- extendedWaitUntil:
    visible: "Aviso"
    timeout: 6000
- tapOn:
    id: "concluir"
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
- tapOn:
    id: "aba-padroes"
- extendedWaitUntil:
    visible: "PADRÕES"
    timeout: 5000
- tapOn: "notas"
# §20: do arquivo, a borda direita devolve a escrita
- swipe:
    start: 99%, 50%
    end: 15%, 50%
- tapOn:
    id: pagina
- inputText: "uma nota para recordar depois"
- tapOn: "Recordar"
- extendedWaitUntil:
    visible: "Revelar"
    timeout: 12000
- inputText: "uma nota para recordar"
- tapOn: "Revelar"
- extendedWaitUntil:
    visible: "DE MEMÓRIA"
    timeout: 5000
# memória e nota lado a lado (§7)
- assertVisible: ".*uma nota para recordar depois.*"
