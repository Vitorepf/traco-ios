appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible: "Deixar como nota"
    timeout: 6000
- tapOn: "Deixar como nota"
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "eu sou um vencedor"
- extendedWaitUntil:
    visible: "Aviso"
    timeout: 6000
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: "aba-notas"
- tapOn:
    id: "aba-padroes"
- extendedWaitUntil:
    visible: "PADRÕES"
    timeout: 5000
- tapOn: "notas"
# §20: do arquivo, a borda direita devolve a escrita
- swipe:
    start: 99%, 50%
    end: 15%, 50%
- tapOn:
    id: pagina
- inputText: "uma nota para recordar depois"
- tapOn: "Recordar"
- extendedWaitUntil:
    visible: "Revelar"
    timeout: 12000
- inputText: "uma nota para recordar"
- tapOn: "Revelar"
- extendedWaitUntil:
    visible: "DE MEMÓRIA"
    timeout: 5000
