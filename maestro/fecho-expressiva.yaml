appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "hoje senti um peso no peito quando acordei e o medo de nao dar conta voltou. chorei no chuveiro. estava pesado o dia inteiro e eu nao disse a ninguem."
- extendedWaitUntil:
    visible: "Começar o timer"
    timeout: 8000
- tapOn: "Começar o timer"
# §8: sair abre a escolha do fecho — dois métodos, não um
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible:
      id: "confirmacao-trancar"
    timeout: 5000
- tapOn:
    id: "confirmacao-trancar"
- extendedWaitUntil:
    visible:
      id: "fecho-expressiva"
    timeout: 5000
- assertVisible:
    id: "fecho-selar"
- assertVisible:
    id: "fecho-queimar"
- takeScreenshot: /tmp/traco-verify/nav/40-fecho
# a linha de sentido é do autor e é a única coisa que sai daqui
- swipe:
    direction: DOWN
- tapOn:
    id: "campo-sentido"
- inputText: "o medo era de decepcionar, nao de falhar"
- tapOn:
    id: "fecho-queimar"
- extendedWaitUntil:
    visible: "Concluir"
    timeout: 9000
# a cena da queima (3s) fecha com o amanhecer (0,9s): o gesto de borda só
# depois do véu ir embora, senão o arrasto morre no overlay em saída
- extendedWaitUntil:
    notVisible:
      id: "fecho-expressiva"
    timeout: 8000
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible: "Expressiva — queimada"
    timeout: 6000
# o texto morreu; o sentido vive
- assertNotVisible: "chorei no chuveiro"
- assertVisible: "o medo era de decepcionar, nao de falhar"
- takeScreenshot: /tmp/traco-verify/nav/41-queimada
