appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "hoje senti um peso no peito quando acordei e o medo de nao dar conta voltou. chorei no chuveiro. estava pesado o dia inteiro e eu nao disse a ninguem."
- extendedWaitUntil:
    visible: "Começar o timer"
    timeout: 8000
- tapOn: "Começar o timer"
- extendedWaitUntil:
    visible:
      id: "timer-expressiva"
    timeout: 4000
- takeScreenshot: /tmp/traco-verify/expressiva-inicio
# o cartão fechou: o timer está rodando, não foi só desenhado
- assertNotVisible: "Começar o timer"
