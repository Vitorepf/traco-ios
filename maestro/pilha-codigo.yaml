appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- tapOn:
    id: regua-codigo
- tapOn: "Swift"
- extendedWaitUntil:
    visible:
      id: pagina-codigo
    timeout: 5000
- tapOn:
    id: pagina-codigo
- inputText: "func senti"
- tapOn:
    id: concluir
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: aba-notas
- takeScreenshot: /tmp/traco-verify/notas-sem-cerca
- assertVisible:
    id: nota-notas
- assertVisible: "func senti"
- assertNotVisible: "```"
