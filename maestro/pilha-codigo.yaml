appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- swipe:
    from:
      id: regua
    direction: LEFT
- tapOn:
    id: regua-codigo
# a folha do sistema tem animação própria: esperar por ela, não tocar no escuro
- extendedWaitUntil:
    visible: "Swift"
    timeout: 6000
- tapOn: "Swift"
- extendedWaitUntil:
    visible:
      id: pagina-codigo
    timeout: 5000
- tapOn:
    id: pagina-codigo
- inputText: "func senti"
- tapOn:
    id: concluir
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: aba-notas
- takeScreenshot: /tmp/traco-verify/notas-sem-cerca
- assertVisible:
    id: nota-notas
- assertVisible: "func senti"
- assertNotVisible: "```"
