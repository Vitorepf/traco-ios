appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible:
      id: "soltar-forma"
    timeout: 8000
- tapOn:
    id: "campo-obstaculo"
- inputText: "o celular na cama"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
- tapOn:
    id: "busca-notas"
- inputText: "celular"
- extendedWaitUntil:
    visible: "o celular na cama"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/nav/20-busca-campo
