appId: app.traco
---
# Não limpa estado — anexa à sessão que esgotou os 15 min.
- launchApp:
    clearState: false
- takeScreenshot: expressiva-15-fim
- tapOn:
    id: "confirmacao-seguir"
    optional: true
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
    optional: true
- extendedWaitUntil:
    visible: "Expressiva — trancada"
    timeout: 6000
- tapOn: "Expressiva — trancada"
- extendedWaitUntil:
    visible:
      id: "confirmacao-abrir"
    timeout: 4000
- tapOn:
    id: "confirmacao-abrir"
- assertVisible: "Ela foi escrita para ficar fechada"
- takeScreenshot: expressiva-15-dupla
