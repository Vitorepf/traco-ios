appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "o texto desta nota de teste"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
- tapOn: "o texto desta nota de teste"
- extendedWaitUntil:
    visible: "Concluir"
    timeout: 5000
- tapOn: Recordar
- extendedWaitUntil:
    visible: "Recordar"
    timeout: 4000
- assertVisible: "Leia uma última vez — a nota vai se esconder."
- takeScreenshot: /tmp/traco-verify/nav/13-recordar
