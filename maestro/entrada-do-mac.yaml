# Corre pelo ./maestro/entrada.sh, que planta os arquivos ANTES deste arranque.
# Sem clearState: o contêiner tem a entrada e o método plantados.
appId: app.traco
---
- launchApp
- extendedWaitUntil:
    visible: "1 nota veio de fora."
    timeout: 10000
- takeScreenshot: /tmp/traco-verify/ciclo/12-entrada-toast
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn: {id: aba-notas}
- assertVisible: ".*li que a atenção é finita.*"
- assertVisible: "LEITURA"
- takeScreenshot: /tmp/traco-verify/ciclo/13-entrada-na-lista
- tapOn: {id: aba-perfil}
- scrollUntilVisible:
    element: {text: "21 do app · 1 seu"}
    direction: DOWN
    timeout: 25000
    centerElement: true
- takeScreenshot: /tmp/traco-verify/ciclo/14-metodo-do-autor
