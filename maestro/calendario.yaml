# O calendário: consulta em prosa, marcação, quatro escalas e arrasto no tempo.
# Ids dentro das escalas não são achados pelo maestro (licoes-swiftui 3 e 6);
# o chrome tem ids. Toques por ponto (iPhone 17 / 17 Pro) só nas escalas.
appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- openLink: traco://calendario/dia
- extendedWaitUntil:
    visible: {id: "calendario-titulo"}
    timeout: 6000
# consulta em prosa: vai à semana que vem sem marcar nada
- tapOn: {id: "calendario-prosa"}
- waitForAnimationToEnd: {timeout: 2000}
- inputText: "o que tenho na semana que vem?"
- waitForAnimationToEnd: {timeout: 1000}
- tapOn: {id: "calendario-marcar"}
- extendedWaitUntil:
    visible: {id: "calendario-titulo", text: ".* – .*"}
    timeout: 5000
- tapOn: {id: "calendario-hoje"}
- waitForAnimationToEnd: {timeout: 1500}
# marcação em prosa abre a ficha em português
- tapOn: {id: "calendario-prosa"}
- waitForAnimationToEnd: {timeout: 2000}
- inputText: "Dentista sexta às 14:30"
- waitForAnimationToEnd: {timeout: 1000}
- tapOn: {id: "calendario-marcar"}
- extendedWaitUntil:
    visible: {id: "ficha-pronto"}
    timeout: 5000
- assertVisible: "Dentista.*"
- takeScreenshot: /tmp/traco-verify/nav/81-ficha
- tapOn: {id: "ficha-pronto"}
- waitForAnimationToEnd: {timeout: 2000}
# as quatro escalas e o arrasto no tempo
- tapOn: {id: "escala-semana"}
- waitForAnimationToEnd: {timeout: 2000}
- tapOn: {id: "escala-mes"}
- waitForAnimationToEnd: {timeout: 2000}
- tapOn: {id: "escala-ano"}
- waitForAnimationToEnd: {timeout: 2000}
- tapOn: {id: "escala-dia"}
- waitForAnimationToEnd: {timeout: 2000}
- swipe: {start: "80%,45%", end: "20%,45%", duration: 400}
- waitForAnimationToEnd: {timeout: 2000}
- takeScreenshot: /tmp/traco-verify/nav/80-calendario
