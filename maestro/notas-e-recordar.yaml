appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible:
      id: "soltar-forma"
    timeout: 8000
- swipe:
    direction: DOWN
- tapOn:
    id: "campo-obstaculo"
- inputText: "o celular na cama"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: "aba-notas"
- extendedWaitUntil:
    visible: "quero correr de manhã"
    timeout: 5000
- tapOn:
    id: "busca-notas"
- inputText: "celular"
- extendedWaitUntil:
    visible: "o celular na cama"
    timeout: 4000
- tapOn:
    id: "aba-padroes"
- extendedWaitUntil:
    visible: "Padrões"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/nav/14-notas-padroes
