appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "nome"
- scrollUntilVisible:
    element:
      id: regua-tabela
    direction: RIGHT
    timeout: 8000
- tapOn:
    id: regua-tabela
- takeScreenshot: /tmp/traco-verify/tabela-regua
- assertVisible:
    id: portal-tabela
- tapOn: ".*linha.*"
- tapOn: ".*coluna.*"
- takeScreenshot: /tmp/traco-verify/tabela-cresce
