appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "nome"
# a régua rola DENTRO de si: scrollUntilVisible pegava o scroll do editor,
# soltava o teclado e a régua saía de cena antes do toque
- repeat:
    times: 8
    commands:
      - swipe:
          from:
            id: regua
          direction: LEFT
- tapOn:
    id: regua-tabela
- takeScreenshot: /tmp/traco-verify/tabela-regua
- assertVisible:
    id: portal-tabela
- tapOn: ".*linha.*"
- tapOn: ".*coluna.*"
- takeScreenshot: /tmp/traco-verify/tabela-cresce
