appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "nome"
# a regua rola DENTRO de si. Dois arrastos: "Tabela" e o 8o chip, e a
# fileira SATURA no fim — com 8 arrastos ela passa do ponto e o chip fica
# para tras, fora da tela.
- repeat:
    times: 2
    commands:
      - swipe:
          from:
            id: regua
          direction: LEFT
- tapOn:
    id: regua-tabela
- takeScreenshot: /tmp/traco-verify/tabela-regua
- assertVisible:
    id: portal-tabela
- tapOn: ".*linha.*"
- tapOn: ".*coluna.*"
- takeScreenshot: /tmp/traco-verify/tabela-cresce
