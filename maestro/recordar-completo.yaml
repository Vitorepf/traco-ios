appId: app.traco
---
- launchApp:
    clearState: true
- tapOn: Página
- inputText: "o texto desta nota de teste"
- swipe:
    direction: DOWN
- tapOn: Recordar
- extendedWaitUntil:
    visible: "RECORDAR"
    timeout: 4000
- extendedWaitUntil:
    visible: "O que estava escrito?"
    timeout: 6000
- tapOn: Memória
- inputText: "correr de manha"
- tapOn: Revelar
- extendedWaitUntil:
    visible: "DE MEMÓRIA"
    timeout: 4000
- assertVisible: "A NOTA"
- takeScreenshot: recordar-lado-a-lado
