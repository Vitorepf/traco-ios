appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "a nota de ontem sobre o projeto"
- takeScreenshot: /tmp/traco-verify/nav/01-escrevendo
- swipe:
    direction: DOWN
- takeScreenshot: /tmp/traco-verify/nav/02-pagina
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: aba-notas
- takeScreenshot: /tmp/traco-verify/nav/03-notas
- tapOn:
    id: aba-padroes
- takeScreenshot: /tmp/traco-verify/nav/04-padroes
- tapOn:
    id: aba-perfil
- takeScreenshot: /tmp/traco-verify/nav/05-perfil
# §20: a barra é chrome da casca — full-width, e nada da escrita vaza por trás
- assertVisible:
    id: "nova-nota"
- assertNotVisible: "Segunda-feira"
# §20: do arquivo, a borda direita devolve a escrita
- swipe:
    start: 99%, 50%
    end: 15%, 50%
- takeScreenshot: /tmp/traco-verify/nav/06-volta
# na casa não há barra nenhuma
- assertNotVisible:
    id: "nova-nota"
- assertNotVisible: "Padrões"
