# ADR 04q: a trajetória nos Padrões — dois períodos, nas palavras do autor.
appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn: {id: pagina}
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible: {id: "soltar-forma"}
    timeout: 25000
- extendedWaitUntil:
    visible: {id: "forma-woop"}
    timeout: 5000
- swipe:
    direction: DOWN
- tapOn: {id: "campo-obstaculo"}
- inputText: "o celular na cama"
- swipe:
    direction: DOWN
- tapOn: {id: "concluir"}
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn: {id: "aba-notas"}
- tapOn: {id: "aba-padroes"}
- extendedWaitUntil:
    visible: "PADRÕES"
    timeout: 5000
- scrollUntilVisible:
    element: {id: "trajetoria"}
    direction: DOWN
    timeout: 25000
- assertVisible: "TRAJETÓRIA"
- assertVisible: ".*o celular na cama.*"
- takeScreenshot: /tmp/traco-verify/ciclo/06-trajetoria
