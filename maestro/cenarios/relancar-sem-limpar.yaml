appId: app.traco
---
# Persistência de verdade: matar o app e abrir de novo, sem clearState.
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "nota que precisa sobreviver"
- tapOn:
    id: concluir
- extendedWaitUntil: {visible: "Permitir", timeout: 2500, optional: true}
- tapOn: {text: "Permitir", optional: true}
- stopApp
- launchApp
# o gesto da borda é do sistema desde o iOS 26 (17/09: a sonda achou o
# alternador de apps no meio do fluxo) — a rota é o botão
- tapOn:
    id: notas-da-pagina
- extendedWaitUntil:
    visible: "nota que precisa sobreviver"
    timeout: 5000
