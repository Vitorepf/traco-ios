appId: app.traco
---
# O autor digita a propria sintaxe no MEIO de uma frase. E texto dele: aparece
# como escreveu, sem virar bloco e sem sumir.
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "vou falar sobre ``` e sobre ::: no meio da frase"
- tapOn:
    id: concluir
- extendedWaitUntil: {visible: "Permitir", timeout: 2500, optional: true}
- tapOn: {text: "Permitir", optional: true}
# o gesto da borda é do sistema desde o iOS 26 (17/09: a sonda achou o
# alternador de apps no meio do fluxo) — a rota é o botão
- tapOn:
    id: notas-da-pagina
- extendedWaitUntil:
    visible: ".*vou falar sobre.*"
    timeout: 5000
