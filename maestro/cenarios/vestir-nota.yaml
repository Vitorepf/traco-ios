appId: app.traco
---
# SPEC §11: a casa é Analisar · Recordar · Anexar. Vestir era o atalho.
# A estrutura nasce da régua (vocabulário), não de um quarto botão.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- tapOn:
    id: pagina
- inputText: "compras da semana"
- assertNotVisible: "Vestir"
- assertNotVisible:
    id: vestir-nota
- takeScreenshot: /tmp/traco-verify/casa-sem-vestir
