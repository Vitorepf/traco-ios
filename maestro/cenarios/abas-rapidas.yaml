appId: app.traco
---
# Trocar de aba rapido nao pode deixar duas telas na mesma camada.
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "base"
- tapOn:
    id: concluir
- extendedWaitUntil: {visible: "Permitir", timeout: 2500, optional: true}
- tapOn: {text: "Permitir", optional: true}
# o gesto da borda é do sistema desde o iOS 26 (17/09: a sonda achou o
# alternador de apps no meio do fluxo) — a rota é o botão
- tapOn:
    id: notas-da-pagina
- tapOn:
    id: aba-padroes
- tapOn:
    id: aba-perfil
- tapOn:
    id: aba-notas
- tapOn:
    id: aba-padroes
- tapOn:
    id: aba-notas
- assertVisible: "base"
- assertVisible:
    id: busca-notas
