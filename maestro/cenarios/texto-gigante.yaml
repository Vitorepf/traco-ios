appId: app.traco
---
# Nota longa: o autor escreve por anos na mesma pagina.
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- repeat:
    times: 12
    commands:
      - inputText: "esta e uma linha longa de prosa que o autor escreveu sem parar. "
- tapOn:
    id: concluir
- extendedWaitUntil: {visible: "Permitir", timeout: 2500, optional: true}
- tapOn: {text: "Permitir", optional: true}
# o gesto da borda é do sistema desde o iOS 26 (17/09: a sonda achou o
# alternador de apps no meio do fluxo) — a rota é o botão
- tapOn:
    id: notas-da-pagina
- extendedWaitUntil:
    visible: ".*esta e uma linha longa.*"
    timeout: 5000
