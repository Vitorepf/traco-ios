appId: app.traco
---
# Concluir duas vezes nao pode criar duas notas nem apagar a primeira.
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "so uma nota"
- tapOn:
    id: concluir
- extendedWaitUntil: {visible: "Permitir", timeout: 2500, optional: true}
- tapOn: {text: "Permitir", optional: true}
- tapOn:
    id: pagina
- tapOn:
    id: concluir
- extendedWaitUntil: {visible: "Permitir", timeout: 2500, optional: true}
- tapOn: {text: "Permitir", optional: true}
# o gesto da borda é do sistema desde o iOS 26 (17/09: a sonda achou o
# alternador de apps no meio do fluxo) — a rota é o botão
- tapOn:
    id: notas-da-pagina
# com espera: a lista chega depois da animação, e `assertVisible` corre na hora
# (passava sozinho e caía na varredura — licoes-swiftui 17)
- extendedWaitUntil:
    visible: "so uma nota"
    timeout: 5000
# e o que o fluxo PROMETE: uma nota, não duas. Sem isto ele só provava que a
# primeira não sumiu, e o "nao pode criar duas" nunca foi testado.
- assertNotVisible:
    text: "so uma nota"
    index: 1
