appId: app.traco
---
# Concluir duas vezes nao pode criar duas notas nem apagar a primeira.
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "so uma nota"
- tapOn:
    id: concluir
- tapOn:
    id: pagina
- tapOn:
    id: concluir
- swipe:
    start: 1%, 50%
    end: 85%, 50%
# com espera: a lista chega depois da animação, e `assertVisible` corre na hora
# (passava sozinho e caía na varredura — licoes-swiftui 17)
- extendedWaitUntil:
    visible: "so uma nota"
    timeout: 5000
# e o que o fluxo PROMETE: uma nota, não duas. Sem isto ele só provava que a
# primeira não sumiu, e o "nao pode criar duas" nunca foi testado.
- assertNotVisible:
    text: "so uma nota"
    index: 1
