# ADR 2026-09-06x — volta 11. O conflito na tela: exporta a versão para Arquivos,
# escreve outra versão aqui, o .md é editado FORA (no Mac, sobre o arquivo do
# simulador) e volta. A prévia mostra AS DUAS versões e a escolha é explícita;
# guardar cria versão nova e não apaga a atual.
#
# Passo manual, entre a exportação e a importação (o editor externo é o ponto):
#   F="$HOME/Library/Developer/CoreSimulator/Devices/<UDID>/data/Containers/\
# Shared/AppGroup/<ID>/File Provider Storage/traco-versao.md"
#   head -1 "$F" > /tmp/novo.md; printf 'Editado FORA do Traco.\n' >> /tmp/novo.md
#   cp /tmp/novo.md "$F"
# A linha 1 é o envelope e precisa sair intacta: sem ela o retorno é `semVinculo`.
#
# O seletor de Arquivos roda fora do processo: maestro não enxerga "Salvar" nem
# o ícone do arquivo por texto. Os toques neles são por ponto.
# Capturas de prova: xcrun simctl io booted screenshot (a do maestro fotografa
# build velho). Restaurar o tamanho do texto ao fim: simctl ui <udid> content_size large.
appId: app.traco
---
- launchApp:
    clearState: true
- openLink: traco://notas
- runFlow:
    when:
      visible: "Abrir"
    commands:
      - tapOn: "Abrir"
      - waitForAnimationToEnd: {timeout: 1500}
- extendedWaitUntil:
    visible: {id: "abrir-trabalhos"}
    timeout: 15000
- tapOn: {id: "abrir-trabalhos"}
- extendedWaitUntil:
    visible: {id: "trabalho-nova-intencao"}
    timeout: 15000
- tapOn: {id: "trabalho-nova-intencao"}
- inputText: "Escrever o convite do encontro"
- waitForAnimationToEnd: {timeout: 1000}
- tapOn: {id: "trabalho-criar"}
- extendedWaitUntil:
    visible: "Escrever minha própria versão"
    timeout: 15000
- tapOn: "Escrever minha própria versão"
- waitForAnimationToEnd: {timeout: 1500}
- tapOn: "Escreva aqui"
- inputText: "Versao 1 - a que sai no arquivo"
- waitForAnimationToEnd: {timeout: 1200}
- tapOn: "Guardar minha versão"
- waitForAnimationToEnd: {timeout: 2500}
- scrollUntilVisible:
    element: "Editar com outras ferramentas"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn: "Editar com outras ferramentas"
- waitForAnimationToEnd: {timeout: 1500}
- takeScreenshot: /tmp/traco-verify/v11-painel-normal
- tapOn: {id: "trabalho-exportar-md"}
- waitForAnimationToEnd: {timeout: 3500}
# "Salvar" do exportador: fora do processo, só por ponto
- tapOn:
    point: "85%,11%"
- waitForAnimationToEnd: {timeout: 3500}
# ---- edite o .md fora do Traço aqui (bloco de comando no cabeçalho) ----
# a versão local avança enquanto o arquivo está fora: as duas pontas mudam
- scrollUntilVisible:
    element: "Editar esta versão"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: "Editar esta versão"
- waitForAnimationToEnd: {timeout: 1800}
- tapOn:
    text: "Versao 1 - a que sai no arquivo"
    index: 1
- waitForAnimationToEnd: {timeout: 1500}
- eraseText: 60
- inputText: "Versao 2 no Traco - o arquivo nao tem esta"
- waitForAnimationToEnd: {timeout: 1500}
- swipe:
    start: 50%, 30%
    end: 50%, 88%
    duration: 800
- scrollUntilVisible:
    element: "Guardar como nova versão"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn: "Guardar como nova versão"
- waitForAnimationToEnd: {timeout: 2500}
- scrollUntilVisible:
    element: {id: "trabalho-importar-md"}
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn: {id: "trabalho-importar-md"}
- waitForAnimationToEnd: {timeout: 3500}
# Explorar > No Meu iPhone > traco-versao.md — todos por ponto
- tapOn:
    point: "77%,94%"
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    point: "18%,29%"
- waitForAnimationToEnd: {timeout: 4000}
- extendedWaitUntil:
    visible: "Revisar arquivo recebido"
    timeout: 15000
# as DUAS versões e a consequência, antes da escolha
- assertVisible: "O trabalho mudou dos dois lados desde a exportação. Compare e escolha."
- assertVisible: {id: "trabalho-conflito-atual"}
- assertVisible: {id: "trabalho-conflito-arquivo"}
- assertVisible: {id: "trabalho-conflito-manter"}
- takeScreenshot: /tmp/traco-verify/v11-conflito
- scrollUntilVisible:
    element: {id: "trabalho-confirmar-importacao"}
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn: {id: "trabalho-confirmar-importacao"}
- waitForAnimationToEnd: {timeout: 2500}
# guardar acrescenta: a versão anterior continua no histórico
- assertVisible: "Nova versão externa guardada. As versões anteriores foram preservadas."
- takeScreenshot: /tmp/traco-verify/v11-guardado
