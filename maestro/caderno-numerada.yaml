appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "leite"
- extendedWaitUntil:
    visible:
      id: regua-numerada
    timeout: 5000
- tapOn:
    id: regua-numerada
- takeScreenshot: /tmp/traco-verify/numerada-regua
- assertVisible:
    id: portal-lista
# editando, a lista mostra o marcador cru; o gutter veste ao soltar
- assertVisible: "1. leite"
- tapOn: "Esconder teclado"
- assertNotVisible: "1. leite"
- assertVisible: "leite"
