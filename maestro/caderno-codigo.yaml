appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
# texto neutro: sem verbo de desejo, a análise cala e não corre com o dedo
- inputText: "um parser"
- swipe:
    from:
      id: regua
    direction: LEFT
- tapOn:
    id: regua-codigo
- extendedWaitUntil:
    visible: "Swift"
    timeout: 6000
- tapOn: "Swift"
- extendedWaitUntil:
    visible:
      id: pagina-codigo
    timeout: 5000
- tapOn:
    id: pagina-codigo
- inputText: "func senti"
- takeScreenshot: /tmp/traco-verify/codigo-editar
- assertNotVisible: "```"
- assertVisible:
    id: portal-codigo
- assertVisible:
    id: pagina-codigo
    text: ".*senti.*"
