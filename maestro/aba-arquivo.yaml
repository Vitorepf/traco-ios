appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "uma nota qualquer"
- swipe:
    direction: DOWN
# a lei do atrito: o arquivo não pode depender de LEMBRAR um gesto invisível
- extendedWaitUntil:
    visible: {id: "notas-da-pagina"}
    timeout: 5000
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible:
      id: aba-notas
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/nav/90-aba-arquivo
