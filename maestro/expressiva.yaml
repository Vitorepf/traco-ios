appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "hoje senti um peso no peito quando acordei e o medo de nao dar conta voltou. chorei no chuveiro. estava pesado o dia inteiro e eu nao disse a ninguem."
- extendedWaitUntil:
    visible: "Começar o timer"
    timeout: 8000
- tapOn: "Começar o timer"
# §20: sair com o timer de pé pede confirmação — o selo vale no gesto
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible:
      id: "confirmacao-trancar"
    timeout: 5000
- tapOn:
    id: "confirmacao-trancar"
# §8: fecha SELADO e oferece a escolha dos dois métodos
- extendedWaitUntil:
    visible:
      id: "fecho-expressiva"
    timeout: 5000
- assertVisible:
    id: "fecho-selar"
- assertVisible:
    id: "fecho-queimar"
- tapOn:
    id: "fecho-selar"
# a selada entra no arquivo com o selo, sem uma linha do conteúdo
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible: "Expressiva — trancada"
    timeout: 6000
- assertNotVisible: "chorei no chuveiro"
- takeScreenshot: /tmp/traco-verify/nav/70-selada
# reabrir custa dupla confirmação
- tapOn: "Expressiva — trancada"
- extendedWaitUntil:
    visible:
      id: "confirmacao-abrir"
    timeout: 5000
- tapOn:
    id: "confirmacao-abrir"
- extendedWaitUntil:
    visible:
      id: "confirmacao-insistir"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/nav/71-dupla
