appId: app.traco
---
- launchApp:
    clearState: true
- tapOn: Página
- inputText: "hoje senti um peso no peito quando acordei e o medo de nao dar conta voltou. chorei no chuveiro. estava pesado o dia inteiro e eu nao disse a ninguem."
- hideKeyboard
- tapOn: Analisar
- tapOn: "Começar o timer"
- tapOn:
    id: "abrir-notas"
- extendedWaitUntil:
    visible:
      id: "confirmacao-trancar"
    timeout: 4000
- tapOn:
    id: "confirmacao-trancar"
- extendedWaitUntil:
    visible:
      id: "confirmacao-seguir"
    timeout: 4000
- tapOn:
    id: "confirmacao-seguir"
- tapOn:
    id: "abrir-notas"
    optional: true
- extendedWaitUntil:
    visible: "Expressiva — trancada"
    timeout: 4000
- takeScreenshot: expressiva-trancada
- tapOn: "Expressiva — trancada"
- extendedWaitUntil:
    visible:
      id: "confirmacao-abrir"
    timeout: 4000
- tapOn:
    id: "confirmacao-abrir"
- extendedWaitUntil:
    visible:
      id: "confirmacao-insistir"
    timeout: 4000
- takeScreenshot: expressiva-dupla
