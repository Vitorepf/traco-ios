appId: app.traco
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "confirmacao-seguir"
    optional: true
- tapOn:
    text: "Voltar à página"
    optional: true
- tapOn:
    id: "abrir-notas"
    optional: true
- extendedWaitUntil:
    visible: "Expressiva — trancada"
    timeout: 12000
- takeScreenshot: expressiva-15-notas
- tapOn: "Expressiva — trancada"
- extendedWaitUntil:
    visible:
      id: "confirmacao-abrir"
    timeout: 4000
- tapOn:
    id: "confirmacao-abrir"
- extendedWaitUntil:
    visible:
      id: "confirmacao-insistir"
    timeout: 4000
- takeScreenshot: expressiva-15-dupla
