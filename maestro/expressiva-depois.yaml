appId: app.traco
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "confirmacao-seguir"
    optional: true
- tapOn:
    text: "Voltar à página"
    optional: true
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
    optional: true
- extendedWaitUntil:
    visible: "Expressiva — trancada"
    timeout: 12000
- takeScreenshot: expressiva-15-notas
- tapOn: "Expressiva — trancada"
- extendedWaitUntil:
    visible:
      id: "confirmacao-abrir"
    timeout: 4000
- tapOn:
    id: "confirmacao-abrir"
- extendedWaitUntil:
    visible:
      id: "confirmacao-insistir"
    timeout: 4000
- takeScreenshot: expressiva-15-dupla
