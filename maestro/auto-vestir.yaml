appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- tapOn: "Página"
- inputText: "quero correr de manhã"
# §17: veste sozinha e o cartão anuncia — sem roubar a página
- extendedWaitUntil:
    visible: "Soltar a forma"
    timeout: 6000
- assertVisible: "quero correr de manhã"
# o cartão é a porta: um toque abre a folha dos campos
- tapOn:
    id: "abrir-campos"
- extendedWaitUntil:
    visible:
      id: "forma-woop"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/hoje/09-auto-vestir
