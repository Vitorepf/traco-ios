appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
# §17: veste sozinha e o cartão anuncia — sem roubar a página
- extendedWaitUntil:
    visible:
      id: "soltar-forma"
    timeout: 6000
- assertVisible: "quero correr de manhã"
# os campos da forma vestida já estão no papel (14/09)
- extendedWaitUntil:
    visible:
      id: "forma-woop"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/hoje/09-auto-vestir
