appId: app.traco
---
- launchApp:
    clearState: true
- takeScreenshot: /tmp/traco-verify/auditoria/01-casa-vazia
- tapOn:
    id: pagina
- inputText: "a arquitetura do app precisa de uma tabela de rotas"
- takeScreenshot: /tmp/traco-verify/auditoria/02-escrevendo-regua
- swipe:
    direction: DOWN
- takeScreenshot: /tmp/traco-verify/auditoria/03-casa-com-texto
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- takeScreenshot: /tmp/traco-verify/auditoria/04-cartao-vestido
- takeScreenshot: /tmp/traco-verify/auditoria/05-folha-campos
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- tapOn:
    id: pagina
- inputText: "eu sou um vencedor"
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- takeScreenshot: /tmp/traco-verify/auditoria/06-cartao-aviso
- tapOn:
    id: "concluir"
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- takeScreenshot: /tmp/traco-verify/auditoria/07-notas-lista
- extendedWaitUntil:
    visible: ".*arquitetura.*"
    timeout: 5000
- tapOn: ".*arquitetura.*"
- takeScreenshot: /tmp/traco-verify/auditoria/11-nota-aberta
- tapOn: Recordar
- extendedWaitUntil:
    visible: "Recordar"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/auditoria/12-recordar
- tapOn: "‹ Voltar"
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- extendedWaitUntil:
    visible:
      id: "busca-notas"
    timeout: 6000
- tapOn:
    id: "busca-notas"
- inputText: "tabela"
- takeScreenshot: /tmp/traco-verify/auditoria/08-notas-busca
- tapOn:
    id: "limpar-busca"
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: aba-padroes
    timeout: 5000
- tapOn:
    id: aba-padroes
- extendedWaitUntil:
    visible: "Padrões"
    timeout: 6000
- takeScreenshot: /tmp/traco-verify/auditoria/09-padroes
- tapOn:
    id: aba-perfil
- extendedWaitUntil:
    visible: "Perfil"
    timeout: 6000
- takeScreenshot: /tmp/traco-verify/auditoria/10-perfil
