# ADR 04l: o catálogo é dado — os métodos novos roteiam pela regex do JSON.
appId: app.traco
---
- launchApp:
    clearState: true
- tapOn: {id: pagina}
- inputText: "terminei de ler o livro sobre atenção e o autor defende que a atenção é finita"
- extendedWaitUntil:
    visible: {id: "soltar-forma"}
    timeout: 8000
- assertVisible: "LEITURA"
- takeScreenshot: /tmp/traco-verify/ciclo/03-leitura-vestida
- extendedWaitUntil:
    visible: {id: "forma-leitura"}
    timeout: 5000
- assertVisible: {id: "campo-fonte"}
- assertVisible: {id: "campo-discordo"}
- takeScreenshot: /tmp/traco-verify/ciclo/04-leitura-campos
