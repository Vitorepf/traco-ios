appId: app.traco
---
- tapOn:
    id: "confirmacao-trancar"
- extendedWaitUntil:
    visible: "Trancada"
    timeout: 4000
- tapOn:
    id: "confirmacao-seguir"
- extendedWaitUntil:
    visible: "Expressiva — trancada"
    timeout: 5000
- tapOn: "Expressiva — trancada"
- tapOn:
    id: "confirmacao-abrir"
- assertVisible: "Ela foi escrita para ficar fechada"
