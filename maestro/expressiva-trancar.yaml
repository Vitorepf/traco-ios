appId: app.traco
---
- launchApp:
    clearState: true
- tapOn: Página
- inputText: "hoje senti um peso no peito quando acordei e o medo de nao dar conta voltou. chorei no chuveiro. estava pesado o dia inteiro e eu nao disse a ninguem."
- extendedWaitUntil:
    visible: "Começar o timer"
    timeout: 8000
- tapOn: "Começar o timer"
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- extendedWaitUntil:
    visible:
      id: "confirmacao-trancar"
    timeout: 5000
- tapOn:
    id: "confirmacao-trancar"
# §8: a saída SELA e abre a escolha dos dois métodos validados
- extendedWaitUntil:
    visible:
      id: "fecho-expressiva"
    timeout: 5000
- assertVisible:
    id: "fecho-selar"
- assertVisible:
    id: "fecho-queimar"
- assertVisible:
    id: "campo-sentido"
- takeScreenshot: /tmp/traco-verify/nav/72-fecho
