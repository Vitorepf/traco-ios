appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- assertVisible:
    id: pagina
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
# §17: a análise chega sozinha na pausa e veste a forma de confiança alta
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- assertVisible:
    id: "soltar-forma"
# o texto do autor fica na página; os campos aparecem abaixo dele
- assertVisible: "quero correr de manhã"
- assertVisible:
    id: "forma-woop"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "eu sou um vencedor"
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- assertVisible: "Aviso"
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
# (a régua com «Analisar» e «Esconder teclado» saiu em 14/09: o silêncio do
# automático segue invisível, e não há mais botão manual na página)
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: "aba-notas"
# §20: do arquivo, a borda direita devolve a escrita
- swipe:
    start: 99%, 50%
    end: 15%, 50%
