appId: app.traco
---
- launchApp:
    clearState: true
- assertVisible: Notas
- tapOn: "Página"
- inputText: "quero correr de manhã"
# §17: a análise chega sozinha na pausa e veste a forma de confiança alta
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- assertVisible:
    id: "forma-woop"
- assertVisible: "Soltar a forma"
- assertVisible: "quero correr de manhã"
- tapOn:
    id: "concluir"
- tapOn: "Página"
- inputText: "eu sou um vencedor"
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- assertVisible: "Aviso"
- tapOn:
    id: "concluir"
- tapOn: "Página"
- inputText: "leite"
- hideKeyboard
# silêncio no automático é invisível; o manual responde com o toast
- assertVisible: Analisar
- tapOn: Analisar
- extendedWaitUntil:
    visible:
      id: "toast-analise"
    timeout: 4000
- tapOn:
    id: "abrir-notas"
- tapOn:
    id: "voltar-pagina"
