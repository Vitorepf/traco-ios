appId: app.traco
---
- launchApp:
    clearState: true
- assertVisible: Notas
- assertVisible: Analisar
- tapOn: "Página"
- inputText: "quero correr de manhã"
- hideKeyboard
- tapOn: Analisar
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 5000
- tapOn: "Abrir a forma WOOP"
- assertVisible:
    id: "forma-woop"
- assertVisible: "quero correr de manhã"
- tapOn:
    id: "concluir"
- tapOn: "Página"
- inputText: "eu sou um vencedor"
- hideKeyboard
- tapOn: Analisar
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 5000
- assertVisible: "Aviso"
- tapOn:
    id: "concluir"
- tapOn: "Página"
- inputText: "leite"
- hideKeyboard
- tapOn: Analisar
- extendedWaitUntil:
    visible:
      id: "toast-analise"
    timeout: 4000
- tapOn:
    id: "abrir-notas"
- tapOn:
    id: "voltar-pagina"
