appId: app.traco
---
- launchApp:
    clearState: true
- assertVisible:
    id: pagina
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
# §17: a análise chega sozinha na pausa e veste a forma de confiança alta
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- assertVisible: "Deixar como nota"
# o texto do autor fica na página; os campos moram na folha
- assertVisible: "quero correr de manhã"
- tapOn:
    id: "abrir-campos"
- assertVisible:
    id: "forma-woop"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- tapOn:
    id: pagina
- inputText: "eu sou um vencedor"
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- assertVisible: "Aviso"
- tapOn:
    id: "concluir"
- tapOn:
    id: pagina
- inputText: "leite"
# hideKeyboard do maestro é inerte no iOS (leis do instrumento 4): o botão da
# régua fecha o teclado de verdade, e o toast sai de trás dele
- tapOn: {text: "Esconder teclado", optional: true}
- waitForAnimationToEnd: {timeout: 1500}
# silêncio no automático é invisível; o manual responde com o toast
- assertVisible: Analisar
- tapOn: Analisar
- extendedWaitUntil:
    visible:
      id: "toast-analise"
    timeout: 4000
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
# §20: do arquivo, a borda direita devolve a escrita
- swipe:
    start: 99%, 50%
    end: 15%, 50%
