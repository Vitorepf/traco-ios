appId: app.traco
---
- launchApp:
    clearState: true
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: aba-notas
- tapOn:
    id: aba-perfil
- extendedWaitUntil:
    visible: "Meu perfil"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/perfil
- assertVisible: "Grok"
- assertVisible:
    id: entrar-conta
- assertVisible:
    id: ajuste-auto-analise
# a lei do dono: nenhuma palavra de chave, token ou preço nesta tela
- assertNotVisible: "xai-"
- assertNotVisible: "Keychain"
- assertNotVisible: "console"
