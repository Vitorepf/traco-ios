# Instigar e Contrapor estão cortados por qualidade (Politica): a Lente não os oferece
# como botão que só responde «indisponível» (auditoria 17/09). O Perfil diz o que está fora.
appId: app.traco
---
- launchApp:
    clearState: true
- tapOn: {id: pagina}
- inputText: "Especificação do módulo de rotas. O problema é que hoje cada tela decide sozinha para onde ir."
- waitForAnimationToEnd: {timeout: 2500}
# o cartão da análise ocupa o rodapé; solta a forma para a barra voltar
- extendedWaitUntil:
    visible: {id: "soltar-forma"}
    timeout: 10000
- tapOn: {id: "soltar-forma"}
- extendedWaitUntil:
    visible: {id: "abrir-lente"}
    timeout: 6000
- tapOn: {id: "abrir-lente"}
- waitForAnimationToEnd: {timeout: 2000}
- assertNotVisible: {id: "instigar"}
- assertNotVisible: {id: "contrapor"}
- takeScreenshot: /tmp/traco-verify/nav/88-lente-sem-rota-cortada
