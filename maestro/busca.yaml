appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible:
      id: "soltar-forma"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "forma-woop"
    timeout: 5000
- swipe:
    direction: DOWN
- tapOn:
    id: "campo-obstaculo"
- inputText: "o celular na cama"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: "aba-notas"
# o alerta de avisos que o clearState traz de volta pode subir a qualquer passo
# depois do Concluir, e come o toque no campo (17/09)
- extendedWaitUntil: {visible: "Permitir", timeout: 1200, optional: true}
- tapOn: {text: "Permitir", optional: true}
- tapOn:
    id: "busca-notas"
- waitForAnimationToEnd: {timeout: 1500}
- inputText: "celular"
- extendedWaitUntil:
    visible:
      id: "busca-notas"
      text: "celular"
    timeout: 4000
- assertVisible: "o celular na cama"
- takeScreenshot: busca-celular
