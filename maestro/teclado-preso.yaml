appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "uma nota qualquer"
# do teclado aberto direto para o arquivo: o foco da casa tem de cair
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible:
      id: aba-perfil
    timeout: 6000
- tapOn:
    id: aba-perfil
- extendedWaitUntil:
    visible: "Perfil"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/nav/60-perfil-sem-teclado
# a barra tem de estar visível: se o teclado estivesse preso, ela sumiria
- assertVisible:
    id: aba-notas
- assertVisible:
    id: nova-nota
