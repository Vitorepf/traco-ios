# A lei do bloqueio da folha do Trabalho (ADR 2026-09-06b): nenhuma ação some.
# Campo vazio não apaga a ação primária — ela continua cápsula, diz o motivo e
# o toque leva o foco ao campo que falta. E o trilho do apoio diz ao VoiceOver
# qual está escolhido (`selected`), que o Picker da V9 dizia de graça e o
# trilho da volta 18 tinha perdido.
# Capturas de prova: xcrun simctl io <UDID> screenshot.
appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- openLink: traco://notas
- runFlow:
    when:
      visible: "Abrir"
    commands:
      - tapOn: "Abrir"
      - waitForAnimationToEnd: {timeout: 1500}
- extendedWaitUntil:
    visible: {id: "abrir-trabalhos"}
    timeout: 15000
- tapOn: {id: "abrir-trabalhos"}
- extendedWaitUntil:
    visible: {id: "trabalho-nova-intencao"}
    timeout: 15000
- tapOn: {id: "trabalho-nova-intencao"}
- inputText: "Apresentar a ideia ao cliente"
- waitForAnimationToEnd: {timeout: 1000}
- tapOn: {id: "trabalho-criar"}
- extendedWaitUntil:
    visible: {id: "trabalho-pedido"}
    timeout: 15000
- waitForAnimationToEnd: {timeout: 2000}
# a folha abre com o teclado no pedido; recolher para trabalhar no trilho
- swipe:
    start: 50%, 30%
    end: 50%, 85%
    duration: 900
- waitForAnimationToEnd: {timeout: 1500}
# --- o trilho diz qual está escolhido, e não só por cor ---
- scrollUntilVisible:
    element: {id: "trabalho-apoio-delegar"}
    direction: UP
    centerElement: true
    timeout: 10000
- assertVisible:
    id: "trabalho-apoio-delegar"
    selected: true
- assertVisible:
    id: "trabalho-apoio-praticar"
    selected: false
- assertVisible:
    id: "trabalho-apoio-combinar"
    selected: false
- takeScreenshot: /tmp/traco-verify/bloqueio-trilho-delegar
- tapOn: {id: "trabalho-apoio-combinar"}
- waitForAnimationToEnd: {timeout: 1500}
- assertVisible:
    id: "trabalho-apoio-combinar"
    selected: true
- assertVisible:
    id: "trabalho-apoio-delegar"
    selected: false
- tapOn: {id: "trabalho-apoio-delegar"}
- waitForAnimationToEnd: {timeout: 1500}
- assertVisible:
    id: "trabalho-apoio-delegar"
    selected: true
# --- a ação primária com o campo vazio: continua na tela e diz por quê ---
- scrollUntilVisible:
    element: {id: "trabalho-gerar"}
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible: {id: "trabalho-gerar"}
- assertVisible: {id: "trabalho-gerar-travado"}
- assertVisible: "Escreva acima o que a IA deve preparar."
- takeScreenshot: /tmp/traco-verify/bloqueio-gerar-com-campo-vazio
# tocar não apaga nada: leva o foco ao campo que falta — e a prova do foco é
# que o texto seguinte entra nele sem nenhum toque no campo
- tapOn: {id: "trabalho-gerar"}
- waitForAnimationToEnd: {timeout: 2000}
- inputText: "o foco veio para ca"
- extendedWaitUntil:
    visible: "o foco veio para ca"
    timeout: 10000
- takeScreenshot: /tmp/traco-verify/bloqueio-foco-no-campo

# --- e a regra que a folha ENUNCIA, ela cumpre (re-G3, achado A) ---
# A volta 18-B tirou o `.disabled(travado)` daqui e portou só a metade
# `!salvo` do guarda: a folha escrevia "Guarde a intenção ou a versão que está
# editando antes de pedir uma nova preparação" e disparava a IA assim mesmo —
# ~90 s de preparação gastos no caso exato que a regra existia para evitar.
# Este trecho falha se alguém devolver a divergência.
- tapOn: {id: "trabalho-pedido"}
- inputText: "Prepare uma apresentacao curta"
- waitForAnimationToEnd: {timeout: 1000}
- swipe:
    start: 50%, 30%
    end: 50%, 85%
    duration: 900
- waitForAnimationToEnd: {timeout: 1500}
# editar a intenção e NÃO guardar
- scrollUntilVisible:
    element: {id: "trabalho-rever-intencao"}
    direction: UP
    centerElement: true
    timeout: 10000
- tapOn: {id: "trabalho-rever-intencao"}
- waitForAnimationToEnd: {timeout: 1500}
- tapOn: "O que quero realizar"
- inputText: " amanha"
- waitForAnimationToEnd: {timeout: 1000}
- swipe:
    start: 50%, 30%
    end: 50%, 85%
    duration: 900
- waitForAnimationToEnd: {timeout: 1500}
- scrollUntilVisible:
    element: {id: "trabalho-gerar"}
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible: {id: "trabalho-gerar-travado"}
- assertVisible: "Guarde a intenção ou a versão que está editando antes de pedir uma nova preparação."
- takeScreenshot: /tmp/traco-verify/bloqueio-edicao-pendente
# o toque NÃO pode começar a preparação; tem de levar ao campo em edição
- tapOn: {id: "trabalho-gerar"}
- waitForAnimationToEnd: {timeout: 2000}
- assertNotVisible: {id: "trabalho-preparando"}
- inputText: " e o foco veio para ca"
- extendedWaitUntil:
    visible: " e o foco veio para ca"
    timeout: 10000
- takeScreenshot: /tmp/traco-verify/bloqueio-edicao-leva-ao-campo
