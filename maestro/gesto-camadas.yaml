appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "a nota de ontem sobre o projeto"
- swipe:
    direction: DOWN
- takeScreenshot: /tmp/traco-verify/nav/10-casa
# da escrita: borda esquerda puxa o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- extendedWaitUntil:
    visible:
      id: aba-notas
    timeout: 4000
- assertVisible:
    id: aba-notas
- takeScreenshot: /tmp/traco-verify/nav/11-arquivo
# do arquivo: borda direita para a esquerda volta a escrever
- swipe:
    start: 99%, 50%
    end: 15%, 50%
- extendedWaitUntil:
    visible: "Concluir"
    timeout: 4000
- takeScreenshot: /tmp/traco-verify/nav/12-volta
# a escrita voltou COM o texto: trocar de camada nunca custa uma palavra (§20)
- assertVisible: ".*a nota de ontem.*"
