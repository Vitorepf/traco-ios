appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "a nota de ontem sobre o projeto"
- swipe:
    direction: DOWN
- takeScreenshot: /tmp/traco-verify/nav/10-casa
# da escrita: borda esquerda puxa o arquivo
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible:
      id: aba-notas
    timeout: 4000
- takeScreenshot: /tmp/traco-verify/nav/11-arquivo
# do arquivo: borda direita para a esquerda volta a escrever
- swipe:
    start: 99%, 50%
    end: 15%, 50%
- extendedWaitUntil:
    visible: "Concluir"
    timeout: 4000
- takeScreenshot: /tmp/traco-verify/nav/12-volta
