appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "capa"
- tapOn:
    id: regua-seccao
- takeScreenshot: /tmp/traco-verify/seccao-regua
- assertVisible:
    id: portal-seccao
- assertVisible: "capa"
