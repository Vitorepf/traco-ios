appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "o texto desta nota de teste"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: "aba-notas"
- tapOn: "o texto desta nota de teste"
- extendedWaitUntil:
    visible: "Concluir"
    timeout: 5000
- tapOn: Recordar
- extendedWaitUntil:
    visible: "Recordar"
    timeout: 4000
- assertVisible: "Leia uma última vez — a nota vai se esconder."
- takeScreenshot: /tmp/traco-verify/nav/13-recordar
