appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "treino da semana"
- tapOn:
    id: regua-titulo
- pressKey: Enter
- inputText: "alongar todo dia"
- tapOn:
    id: regua-lista
- tapOn: "Esconder teclado"
- tapOn:
    id: "concluir"
# o gesto da borda é do sistema desde o iOS 26 (17/09: a sonda achou o
# alternador de apps no meio do fluxo) — a rota é o botão
- tapOn:
    id: notas-da-pagina
- tapOn:
    id: "aba-notas"
- tapOn: "treino da semana"
- extendedWaitUntil:
    visible: "alongar todo dia"
    timeout: 5000
