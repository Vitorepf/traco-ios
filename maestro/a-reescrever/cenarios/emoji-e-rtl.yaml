appId: app.traco
---
# Texto que nao e ASCII: emoji com modificador, acento e RTL.
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "saudade 😀 coração"
# "Citacao" fica sob a mascara depois que "Todas" entrou na regua:
# o centro do elemento cortado cai fora da tela e o toque escorrega
# para a porta. Rolar a regua primeiro, como nos fluxos que passam.
- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: regua
          direction: LEFT
- tapOn:
    id: regua-citacao
- extendedWaitUntil:
    visible: "saudade 😀 coração"
    timeout: 5000
- tapOn:
    id: concluir
# o gesto da borda é do sistema desde o iOS 26 (17/09: a sonda achou o
# alternador de apps no meio do fluxo) — a rota é o botão
- tapOn:
    id: notas-da-pagina
- extendedWaitUntil:
    visible: "saudade 😀 coração"
    timeout: 5000
