appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible:
      id: "soltar-forma"
    timeout: 8000
- swipe:
    direction: DOWN
- tapOn:
    id: "campo-obstaculo"
- inputText: "o celular na cama"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
# da escrita, o voltar do topo traz o arquivo (o gesto da borda saiu)
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- tapOn:
    id: "aba-notas"
# D1: o filtro é uma palavra que abre um menu — abrir, escolher; abrir, desfazer
- tapOn:
    id: "filtro-notas"
- tapOn: "WOOP"
- assertVisible: "quero correr de manhã"
- tapOn:
    id: "filtro-notas"
- tapOn: "WOOP"
- tapOn:
    id: "busca-notas"
- eraseText
- inputText: "celular"
- assertVisible: "o celular na cama"
- tapOn:
    id: "limpar-busca"
- assertVisible:
    id: "busca-notas"
    text: "vazio"
