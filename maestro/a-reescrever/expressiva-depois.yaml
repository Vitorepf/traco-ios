appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "hoje senti um peso no peito quando acordei e o medo de nao dar conta voltou. chorei no chuveiro. estava pesado o dia inteiro e eu nao disse a ninguem."
- extendedWaitUntil:
    visible: "Começar o timer"
    timeout: 8000
- tapOn: "Começar o timer"
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible:
      id: "confirmacao-trancar"
    timeout: 5000
- tapOn:
    id: "confirmacao-trancar"
# §8: a saída SELA e abre a escolha dos dois métodos validados
- extendedWaitUntil:
    visible:
      id: "fecho-expressiva"
    timeout: 5000
- tapOn:
    id: "fecho-selar"
# o que este flow prova sozinho: o selo SOBREVIVE ao relançamento do app
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd: {timeout: 2500}
- tapOn:
    id: "notas-da-pagina"
- extendedWaitUntil:
    visible: "Expressiva — trancada"
    timeout: 6000
- assertNotVisible: "chorei no chuveiro"
- takeScreenshot: /tmp/traco-verify/nav/74-selada-depois
