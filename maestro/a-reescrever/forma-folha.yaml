appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
# §17: a forma veste sozinha; a folha sobe a UM toque (modal não rouba a escrita)
- extendedWaitUntil:
    visible:
      id: "soltar-forma"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "forma-woop"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/folha-vestida
- swipe:
    direction: DOWN
- tapOn:
    id: "campo-resultado"
- inputText: "correr 5km"
- takeScreenshot: /tmp/traco-verify/folha-preenchida
- assertVisible: "correr 5km"
# ADR 2026-09-03a: preencher um campo TIRA o cartão — ele cobria os campos de
# baixo. O "um toque desfaz" vale enquanto o autor escreve na página, não aqui.
#
# Por ID, não por texto: "Deixar como nota" existe DUAS vezes — no cartão e no
# cabeçalho da folha (`soltar-na-folha`, que deve continuar ali). A asserção por
# texto casava com o da folha e só passava por sorte de timing.
#
# E com ESPERA: `assertNotVisible` corre na hora e perde a corrida com o ciclo
# de render sob carga (passava sozinho, caía na varredura). Sumiço se prova
# com `extendedWaitUntil: notVisible`, que insiste.
- extendedWaitUntil:
    notVisible: {id: "cartao-analise"}
    timeout: 4000
- extendedWaitUntil:
    notVisible: {id: "soltar-forma"}
    timeout: 4000
- assertVisible: {id: "soltar-na-folha"}
