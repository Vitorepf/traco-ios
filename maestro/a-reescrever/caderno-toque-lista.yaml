appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "abrir a porta"
- tapOn:
    id: regua-lista
- tapOn: "Esconder teclado"
- takeScreenshot: /tmp/traco-verify/toque-lista
- assertNotVisible: "- abrir a porta"
- assertVisible: "abrir a porta"
