appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "a noite"
# "Citacao" fica sob a mascara depois que "Todas" entrou na regua:
# o centro do elemento cortado cai fora da tela e o toque escorrega
# para a porta. Rolar a regua primeiro, como nos fluxos que passam.
- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: regua
          direction: LEFT
- tapOn:
    id: regua-citacao
- takeScreenshot: /tmp/traco-verify/citacao-regua
- assertVisible:
    id: portal-citacao
- assertVisible: "a noite"
