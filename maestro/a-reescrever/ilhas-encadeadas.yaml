# ADR 04z: os métodos novos se encadeiam. A Inversão ("como garantir que
# falhe") vira Pré-mortem com as palavras do autor copiadas e a origem ligada.
appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn: {id: pagina}
- inputText: "como garantir que falhe o lançamento do curso"
- extendedWaitUntil:
    visible: {id: "soltar-forma"}
    timeout: 25000
- extendedWaitUntil:
    visible: {id: "forma-inversao"}
    timeout: 5000
- swipe:
    direction: DOWN
- tapOn: {id: "campo-quero"}
- inputText: "lançar o curso em outubro"
- swipe:
    direction: DOWN
- tapOn: {id: "campo-falhe"}
- inputText: "não avisar ninguém até a véspera"
- extendedWaitUntil:
    visible: "Virar Pré-mortem"
    timeout: 8000
- assertVisible: "Depois disto"
- takeScreenshot: /tmp/traco-verify/ciclo/37-inversao-depois-disto
- tapOn: "Virar Pré-mortem"
- extendedWaitUntil:
    visible: {id: "forma-premortem"}
    timeout: 25000
- assertVisible: "lançar o curso em outubro"
- assertVisible: "não avisar ninguém até a véspera"
- assertVisible: ".*como garantir que falhe.*"
- takeScreenshot: /tmp/traco-verify/ciclo/38-premortem-encadeado
