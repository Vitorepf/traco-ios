# A linha "?" (ADR o): a pergunta do autor vira cartão; sem conta, o app diz.
appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn: {id: pagina}
- inputText: "estou desenhando a tabela de rotas do app\n? como posso definir a fronteira entre rota e destino"
- extendedWaitUntil:
    visible: {id: "perguntar-sabia"}
    timeout: 15000
- tapOn: {id: "perguntar-sabia"}
- waitForAnimationToEnd: {timeout: 2000}
# Com a conta ligada (03/set) o cartão de recusa não existe mais: o toque
# dispara a sábia de verdade, e este fluxo virou teste de integração VIVO —
# é o único lugar que prova a ADR o ponta a ponta com modelo real.
- extendedWaitUntil:
    visible: {id: "resposta-sabia"}
    timeout: 25000
# §17: a resposta tem até 900 caracteres. O teclado não pode cobrir a leitura.
- assertNotVisible: "Q"
