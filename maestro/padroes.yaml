appId: app.traco
---
- launchApp:
    clearState: true
- tapOn: Página
- inputText: "quero correr de manhã"
# §17: veste sozinha; a folha dos campos sobe a um toque
- extendedWaitUntil:
    visible:
      id: "abrir-campos"
    timeout: 8000
- tapOn:
    id: "abrir-campos"
- extendedWaitUntil:
    visible:
      id: "forma-woop"
    timeout: 5000
- tapOn:
    id: "campo-obstaculo"
- inputText: "o celular na cama"
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- tapOn:
    id: "abrir-notas"
- tapOn:
    id: "abrir-padroes"
- extendedWaitUntil:
    visible: "PADRÕES"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/padroes
