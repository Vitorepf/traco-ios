appId: app.traco
---
- launchApp:
    clearState: true
- tapOn: Página
- inputText: "quero correr de manhã"
- hideKeyboard
- tapOn: Analisar
- tapOn: "Abrir a forma WOOP"
- extendedWaitUntil:
    visible:
      id: "forma-woop"
    timeout: 4000
- tapOn:
    id: "campo-obstaculo"
- inputText: "o celular na cama"
- hideKeyboard
- tapOn:
    id: "concluir"
- tapOn:
    id: "abrir-notas"
- tapOn:
    id: "abrir-padroes"
- extendedWaitUntil:
    visible: "CÓDICE"
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "pergunta-padroes-0"
    timeout: 6000
- tapOn:
    id: "pergunta-padroes-0"
- extendedWaitUntil:
    visible:
      id: "cartao-padroes"
    timeout: 4000
- assertVisible: "PERGUNTA DO CÓDICE"
- takeScreenshot: padroes-resposta
