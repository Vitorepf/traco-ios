appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
# "Silêncio" é o ÚLTIMO dos doze chips: a régua rola DENTRO de si, e
# scrollUntilVisible pegava o scroll do editor em vez dela
- repeat:
    times: 12
    commands:
      - swipe:
          from:
            id: regua
          direction: LEFT
- tapOn:
    id: regua-silencio
- takeScreenshot: /tmp/traco-verify/silencio-regua
- assertVisible:
    id: portal-silencio
- tapOn:
    id: portal-silencio
- takeScreenshot: /tmp/traco-verify/silencio-toque
- assertVisible:
    id: portal-silencio
- assertVisible:
    id: regua
