appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
# o chip "Silêncio" é o ÚLTIMO da régua: rolar até ele
- scrollUntilVisible:
    element:
      id: regua-silencio
    direction: RIGHT
    timeout: 8000
- tapOn:
    id: regua-silencio
- takeScreenshot: /tmp/traco-verify/silencio-regua
- assertVisible:
    id: portal-silencio
- tapOn:
    id: portal-silencio
- takeScreenshot: /tmp/traco-verify/silencio-toque
- assertVisible:
    id: portal-silencio
- assertVisible:
    id: regua
