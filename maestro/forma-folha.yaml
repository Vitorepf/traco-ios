appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
# §17: a forma veste sozinha; a folha sobe a UM toque (modal não rouba a escrita)
- extendedWaitUntil:
    visible:
      id: "abrir-campos"
    timeout: 8000
- tapOn:
    id: "abrir-campos"
- extendedWaitUntil:
    visible:
      id: "forma-woop"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/folha-vestida
- tapOn:
    id: "campo-resultado"
- inputText: "correr 5km"
- takeScreenshot: /tmp/traco-verify/folha-preenchida
- assertVisible: "correr 5km"
- assertVisible: "Deixar como nota"
