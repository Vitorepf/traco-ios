appId: app.traco
---
- launchApp:
    clearState: true
- tapOn:
    id: pagina
- inputText: "capa"
- swipe:
    from:
      id: regua
    direction: LEFT
- tapOn:
    id: regua-subseccao
- takeScreenshot: /tmp/traco-verify/subseccao-regua
- assertVisible:
    id: portal-subseccao
- assertVisible: "capa"
