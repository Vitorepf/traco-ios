appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- takeScreenshot: /tmp/traco-verify/hoje/ax5-01-pagina
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
# em AX o cartão vale uma linha com o teclado de pé e as saídas vivem no menu
# dela (ADR 05y, correção do G4): o que está sempre à vista é o cartão
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 6000
- takeScreenshot: /tmp/traco-verify/hoje/ax5-02-forma
- tapOn:
    id: "concluir"
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
- takeScreenshot: /tmp/traco-verify/hoje/ax5-03-notas
# volta 8 (ADR 05t): as duas telas seguintes da jornada também em AX5
- tapOn:
    id: "aba-calendario"
- extendedWaitUntil:
    visible:
      id: calendario-titulo
    timeout: 6000
- takeScreenshot: /tmp/traco-verify/hoje/ax5-04-calendario
- tapOn:
    id: "aba-perfil"
- takeScreenshot: /tmp/traco-verify/hoje/ax5-05-perfil
