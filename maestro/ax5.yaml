appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- takeScreenshot: /tmp/traco-verify/hoje/ax5-01-pagina
- tapOn: "Página"
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible: "Soltar a forma"
    timeout: 6000
- takeScreenshot: /tmp/traco-verify/hoje/ax5-02-forma
- tapOn:
    id: "concluir"
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
- takeScreenshot: /tmp/traco-verify/hoje/ax5-03-notas
