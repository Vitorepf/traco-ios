appId: app.traco
---
- launchApp:
    clearState: true
    arguments:
      sem-grok: true
- extendedWaitUntil:
    visible:
      id: pagina
    timeout: 8000
- takeScreenshot: /tmp/traco-verify/hoje/01-pagina-vazia
- tapOn:
    id: pagina
- inputText: "quero correr de manhã"
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 5000
- assertVisible: "Deixar como nota"
- takeScreenshot: /tmp/traco-verify/hoje/02-cartao-woop
- tapOn:
    id: "abrir-campos"
- takeScreenshot: /tmp/traco-verify/hoje/03-forma-woop
# a folha dos campos cobre a topbar: fecha antes de concluir
- swipe:
    direction: DOWN
- tapOn:
    id: "concluir"
- tapOn:
    id: pagina
- inputText: "eu sou um vencedor"
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "cartao-analise"
    timeout: 5000
- takeScreenshot: /tmp/traco-verify/hoje/04-aviso
- tapOn:
    id: "concluir"
# §20: da escrita, a borda esquerda traz o arquivo
- swipe:
    start: 1%, 50%
    end: 85%, 50%
- tapOn:
    id: "aba-notas"
- takeScreenshot: /tmp/traco-verify/hoje/05-notas
- tapOn:
    id: "aba-padroes"
- takeScreenshot: /tmp/traco-verify/hoje/06-padroes
# Padrões cita a voz do autor — a nota mais recente vem primeiro (§9)
- assertVisible: ".*eu sou um vencedor.*"
