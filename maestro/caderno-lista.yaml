appId: app.traco
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Permitir"
    timeout: 3000
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    id: pagina
- inputText: "- "
- inputText: "leite"
- takeScreenshot: /tmp/traco-verify/lista-una
# a lista digita crua (marcador visível); veste ao soltar o teclado
- assertVisible: "- leite"
- tapOn: "Esconder teclado"
- assertNotVisible: "- leite"
- assertVisible: "leite"
